<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAX FIRE 3D</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #87ceeb;
      font-family: Arial, sans-serif;
    }
    #hud {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 5;
      color: white;
      background: #10131bcc;
      padding: 12px;
      border: 1px solid #ff6333;
      border-radius: 10px;
    }
    #hud h2 { color: #ff6333; }
    #controls {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      gap: 10px;
    }
    button {
      width: 55px;
      height: 55px;
      border: 1px solid white;
      border-radius: 12px;
      background: #10131bcc;
      color: white;
      font-size: 22px;
    }
    #jump { background: #ff6333; }
    #message {
      font-size: 12px;
      color: #a7f3d0;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <h2>🔥 MAX FIRE</h2>
    <p>3D GAME PROTOTYPE</p>
    <p>Move: Arrow buttons</p>
    <p id="message">Loading 3D world...</p>
  </div>

  <div id="controls">
    <button id="left">←</button>
    <button id="forward">↑</button>
    <button id="back">↓</button>
    <button id="right">→</button>
    <button id="jump">↗</button>
  </div>

  <script type="module">
    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 25, 100);

    const camera = new THREE.PerspectiveCamera(
      70, innerWidth / innerHeight, 0.1, 200
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x526644, 2));

    const sun = new THREE.DirectionalLight(0xffffff, 2);
    sun.position.set(10, 20, 10);
    sun.castShadow = true;
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0x568b42 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(200, 80, 0x476b35, 0x65894e);
    grid.position.y = 0.02;
    scene.add(grid);

    // Simple placeholder player model
    const player = new THREE.Group();

    const body = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, 1.2, 0.45),
      new THREE.MeshStandardMaterial({ color: 0xff6333 })
    );
    body.position.y = 1.3;
    body.castShadow = true;
    player.add(body);

    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.35, 16, 12),
      new THREE.MeshStandardMaterial({ color: 0xf1c7a5 })
    );
    head.position.y = 2.15;
    head.castShadow = true;
    player.add(head);

    scene.add(player);

    // Trees around the training area
    for (let i = 0; i < 35; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 12 + Math.random() * 35;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;

      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18, 0.28, 2, 7),
        new THREE.MeshStandardMaterial({ color: 0x654321 })
      );
      trunk.position.set(x, 1, z);
      trunk.castShadow = true;
      scene.add(trunk);

      const leaves = new THREE.Mesh(
        new THREE.ConeGeometry(1.2, 3, 8),
        new THREE.MeshStandardMaterial({ color: 0x236b35 })
      );
      leaves.position.set(x, 3, z);
      leaves.castShadow = true;
      scene.add(leaves);
    }

    const keys = { left: false, right: false, forward: false, back: false };
    const buttonIds = ['left', 'right', 'forward', 'back'];

    buttonIds.forEach(id => {
      const button = document.getElementById(id);
      button.addEventListener('pointerdown', e => {
        e.preventDefault();
        keys[id] = true;
        button.setPointerCapture(e.pointerId);
      });
      button.addEventListener('pointerup', () => keys[id] = false);
      button.addEventListener('pointercancel', () => keys[id] = false);
      button.addEventListener('lostpointercapture', () => keys[id] = false);
    });

    let jumpVelocity = 0;
    let verticalPosition = 0;

    document.getElementById('jump').addEventListener('pointerdown', () => {
      if (verticalPosition === 0) jumpVelocity = 0.16;
    });

    function animate() {
      requestAnimationFrame(animate);

      const speed = 0.12;
      if (keys.left) player.position.x -= speed;
      if (keys.right) player.position.x += speed;
      if (keys.forward) player.position.z -= speed;
      if (keys.back) player.position.z += speed;

      if (keys.left || keys.right || keys.forward || keys.back) {
        player.rotation.y = Math.atan2(
          (keys.left ? -1 : 0) + (keys.right ? 1 : 0),
          (keys.forward ? -1 : 0) + (keys.back ? 1 : 0)
        );
      }

      jumpVelocity -= 0.008;
      verticalPosition += jumpVelocity;
      if (verticalPosition < 0) {
        verticalPosition = 0;
        jumpVelocity = 0;
      }
      player.position.y = verticalPosition;

      camera.position.set(
        player.position.x,
        player.position.y + 4,
        player.position.z + 7
      );
      camera.lookAt(
        player.position.x,
        player.position.y + 1,
        player.position.z
      );

      renderer.render(scene, camera);
    }

    document.getElementById('message').textContent =
      '3D WORLD READY — MOVE TO EXPLORE';

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
